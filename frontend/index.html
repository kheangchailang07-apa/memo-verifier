<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>APA Policy &amp; Memo - Official Company Guidelines &amp; Staff Sign-off</title>
    <meta name="description" content="APA Policy &amp; Memo: Official company policies, mandatory workplace guidelines, and two-step verified memo sign-off." />
    <meta property="og:title" content="APA Policy &amp; Memo - Official Company Guidelines &amp; Staff Sign-off" />
    <meta property="og:description" content="APA Policy &amp; Memo: Official company policies, mandatory workplace guidelines, and two-step verified memo sign-off." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0f172a" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background-color: #0f172a;
      }

      .apa-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background-color: #0f172a;
        background-image: radial-gradient(circle at 50% 35%, rgba(99, 102, 241, 0.18), transparent 55%);
        color: #e2e8f0;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        animation: apa-splash-in 0.25s ease-out;
      }

      @keyframes apa-splash-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      .apa-splash__mark {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #4f46e5, #6366f1);
        box-shadow: 0 18px 40px rgba(79, 70, 229, 0.45);
      }

      .apa-splash__mark svg {
        width: 34px;
        height: 34px;
        stroke: #ffffff;
      }

      .apa-splash__title {
        margin: 0;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #f8fafc;
      }

      .apa-splash__subtitle {
        margin: -10px 0 0;
        font-size: 12px;
        color: #94a3b8;
        letter-spacing: 0.06em;
      }

      .apa-splash__spinner {
        width: 34px;
        height: 34px;
        margin-top: 6px;
        border-radius: 50%;
        border: 3px solid rgba(148, 163, 184, 0.25);
        border-top-color: #6366f1;
        animation: apa-splash-spin 0.8s linear infinite;
      }

      @keyframes apa-splash-spin {
        to { transform: rotate(360deg); }
      }

      .apa-splash__status {
        font-size: 11px;
        color: #64748b;
        letter-spacing: 0.08em;
      }

      @media (prefers-reduced-motion: reduce) {
        .apa-splash,
        .apa-splash__spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- Splash screen: painted before the JS bundle boots, replaced by React on mount -->
    <div id="root">
      <div class="apa-splash" role="status" aria-live="polite" aria-label="Loading APA Policy and Memo">
        <div class="apa-splash__mark">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            <path d="M9 12l2 2 4-4" />
          </svg>
        </div>
        <p class="apa-splash__title">APA Policy &amp; Memo</p>
        <p class="apa-splash__subtitle">Official Company Guidelines &amp; Staff Sign-off</p>
        <div class="apa-splash__spinner" aria-hidden="true"></div>
        <p class="apa-splash__status">Establishing secure session&hellip;</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
